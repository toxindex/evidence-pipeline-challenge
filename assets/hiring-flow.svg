<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">What ToxIndex is hiring for</title>
  <desc id="desc">Real-world evidence flows through scientific informatics, data platforms and orchestration, and intelligent applications to become a trustworthy self-hosted product.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a }
      .detail { font-family: Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #475569 }
      .small { font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; letter-spacing: 1px }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow) }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" class="small">BUILD TRUSTWORTHY SYSTEMS FROM REAL EVIDENCE</text>

  <rect x="35" y="121" width="205" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="137" y="164" text-anchor="middle" class="label">Real-world evidence</text>
  <text x="137" y="193" text-anchor="middle" class="detail">scientific · regulatory</text>
  <text x="137" y="216" text-anchor="middle" class="detail">health · environmental</text>

  <path d="M240 180 H292" class="arrow"/>

  <rect x="310" y="70" width="255" height="80" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="437" y="103" text-anchor="middle" class="label">Scientific informatics</text>
  <text x="437" y="128" text-anchor="middle" class="detail">ETL · BioBricks · bio/chem data</text>

  <rect x="310" y="160" width="255" height="80" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="437" y="193" text-anchor="middle" class="label">Data platforms</text>
  <text x="437" y="218" text-anchor="middle" class="detail">Spark · streaming · scale</text>

  <rect x="310" y="250" width="255" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="437" y="283" text-anchor="middle" class="label">Systems &amp; orchestration</text>
  <text x="437" y="308" text-anchor="middle" class="detail">Temporal · Kubernetes · Helm</text>

  <path d="M565 110 C625 110 625 180 662 180" class="arrow"/>
  <path d="M565 200 H662" class="arrow"/>
  <path d="M565 290 C625 290 625 220 662 220" class="arrow"/>

  <rect x="680" y="121" width="270" height="118" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="815" y="164" text-anchor="middle" class="label">Intelligent applications</text>
  <text x="815" y="193" text-anchor="middle" class="detail">APIs · interfaces</text>
  <text x="815" y="216" text-anchor="middle" class="detail">models · grounded agents</text>

  <path d="M950 180 H967" class="arrow"/>

  <rect x="985" y="121" width="180" height="118" rx="14" fill="#0f172a"/>
  <text x="1075" y="164" text-anchor="middle" class="label" fill="#ffffff">Useful product</text>
  <text x="1075" y="193" text-anchor="middle" class="detail" fill="#cbd5e1">self-hosted</text>
  <text x="1075" y="216" text-anchor="middle" class="detail" fill="#cbd5e1">auditable · reliable</text>
</svg>
